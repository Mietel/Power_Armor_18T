# FLIR18T v0.5 development CI
name: Build FLIR18T Compat v0.5

on:
  push:
    branches: [ flir18t-mobilesdk-v0.5 ]
    paths-ignore:
      - 'flir18t/v0.5/out/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flir18t/v0.5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flir18t-mobilesdk-v0.5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK signature and alignment
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/build-tools/35.0.0/zipalign -c -v 4 "$APK"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK"

      - name: Package Magisk module
        run: |
          set -eux
          rm -rf out build-module
          mkdir -p out build-module/system/priv-app/FLIR18TCompat build-module/system/etc/permissions
          cp app/build/outputs/apk/release/app-release.apk out/FLIR18TCompat-v0.5.apk
          cp app/build/outputs/apk/release/app-release.apk build-module/system/priv-app/FLIR18TCompat/FLIR18TCompat.apk
          cp magisk/module.prop magisk/customize.sh magisk/service.sh magisk/action.sh build-module/
          cp magisk/system/etc/permissions/privapp-permissions-flir18t-compat.xml build-module/system/etc/permissions/
          cp README.md build-module/README.md
          chmod +x build-module/customize.sh build-module/service.sh build-module/action.sh
          (cd build-module && zip -r ../out/18T-FLIR-MobileSDK-Compat-v0.5.zip .)
          sha256sum out/FLIR18TCompat-v0.5.apk out/18T-FLIR-MobileSDK-Compat-v0.5.zip > out/SHA256SUMS.txt
          cp README.md out/README-v0.5.md

      - name: Upload build bundle
        uses: actions/upload-artifact@v4
        with:
          name: FLIR18T-Compat-v0.5
          path: flir18t/v0.5/out/
          if-no-files-found: error
          compression-level: 0

      - name: Commit build artifacts to development branch
        run: |
          git config user.name 'FLIR18T CI'
          git config user.email 'actions@users.noreply.github.com'
          git add out
          git diff --cached --quiet && exit 0
          git commit -m 'ci: build FLIR18T compat v0.5 artifacts [skip ci]'
          git push origin HEAD:flir18t-mobilesdk-v0.5
